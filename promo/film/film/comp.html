<!doctype html>
<html><head><meta charset="utf-8">
<!--
  claude-mimic · launch film. One seekable timeline; every frame is a pure function of t.
  120 BPM (bar = 2 s), 58.5 s, two cuts: comp.html?lang=en | ?lang=zh.  ?t=12.3 draws that moment (for stills), ?hud shows t.
  The carry element is the orange asterisk the mascot holds up in the repo's logo.png (traced: data/star.json). It is the
  only accent-coloured thing in the film: a spinner in the dark, the typing caret, the terminal cursor, the reel's caret,
  the bullet, the field the camera dives through, and finally the asterisk in the logo again.
  The terminal is a real session (session/capture.sh → data/term.json), shown verbatim; rows cut are marked '│  …'.
  Copy is the only thing that changes between cuts; commands, output, model names and the README's 0% / 100% are data.
  Contract: __ready, __meta, __seek(t), __motion(t0,t1), __events(), __handoff(), __copy.
-->
<style>
@font-face{font-family:"PFSF";src:url("fonts/PingFangSF.ttf") format("truetype");font-weight:100 900;font-display:block}
@font-face{font-family:"JBM";src:url("fonts/JetBrainsMono-Regular.ttf") format("truetype");font-weight:400;font-display:block}
@font-face{font-family:"JBM";src:url("fonts/JetBrainsMono-Bold.ttf") format("truetype");font-weight:700;font-display:block}
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#141413;font-family:"PFSF";color:#FAF9F5;font-kerning:normal}
.abs{position:absolute;left:0;top:0}

#twin{position:absolute;border-radius:16px;background:#1C1C1A;box-shadow:0 0 0 1px rgba(255,255,255,0.075),0 40px 120px rgba(0,0,0,0.55)}

#logo{position:absolute;left:0;top:0;transform-origin:0 0}

</style>
<script src="mspring.js"></script>
</head><body>
<div id="stage">
  <img id="f3d" style="display:none">
  <div id="sT" class="abs"></div>
  <!-- terminal (real session) -->
  <div id="sTerm" class="abs" style="display:none;width:1920px;height:1080px">
    <div id="term"><div id="twin"><div id="tbar"><i style="left:20px"></i><i style="left:42px"></i><i style="left:64px"></i><div id="ttitle" class="mono"></div></div></div>
      <div id="tclip"><div id="twash" class="abs"></div><div id="trows" class="abs"></div></div></div>
  </div>
  <!-- model reel -->
  <div id="sReel" class="abs" style="display:none;width:1920px;height:1080px"></div>
  <!-- 0% / 0% / 100% -->
  <div id="sStat" class="abs" style="display:none;width:1920px;height:1080px"></div>
  <!-- lockup -->
  <div id="sLock" class="abs" style="display:none;width:1920px;height:1080px"><img id="logo" src="brand/logo.png"><div id="lockTxt" class="abs"></div></div>
  <svg id="carrySvg" class="abs" width="1920" height="1080" viewBox="0 0 1920 1080"><path id="lockStar" fill="#E97F57" style="display:none"/><path id="carryP" fill="#E97F57"/></svg>
  <div id="scrim"></div>
  <div id="caps" class="abs"></div>
  <div id="fade"></div>
  <div id="hud"></div>
</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const LANG = Q.get('lang') === 'zh' ? 'zh' : 'en';
if (LANG === 'zh') document.documentElement.lang = 'zh-Hans';
const FPS = 30, BPM = 120, BAR = 2, BEAT = 0.5, DUR = 58.5;
const ACC = '#E97F57', PAPER = '#FAF9F5', GRAPH = '#87867F';

// ───────────────────────── copy (one language per cut; commands, output, model names, 0% / 100% are data) ─────────────────────────
const COPY = {
  en: {
    th1: "Look like you're", th2: 'using Claude Code.', th3: "Even when you're not.",
    beforeH: 'Every commit says who helped.', beforeS: 'Co-authored-by: whatever your agent runs on.',
    instH: 'One line. Every agent you use.', instS: 'Cursor, Codex, Gemini CLI, OpenCode, Windsurf, Cline and more.',
    readH: 'It reads the repo before it writes.', readS: "Status, diff and history first. The repo's own conventions win.",
    afterH: "Claude Code's exact Git dialect.", afterS: 'Trailer on the last line, one blank line above, from noreply@anthropic.com.',
    prH: 'Pull requests, 1:1.', prS: 'A title under 70 characters. Summary, Test plan, signature.',
    reelH: 'The right Claude for the job.', reelS: '22 catalog models, 37 valid forms, checked against Claude Code v2.1.310.',
    safeH: 'Safe by default.', safeS: 'No empty commits, no secrets, no amends, no force-push.',
    st1: 'intelligence boost', st2: 'Anthropic API credits', st3: 'pure Claude aesthetic',
    fin: 'Nobody has to know.',
    disc: 'An independent community project. Not affiliated with Anthropic.',
  },
  zh: {
    th1: '让别人以为，', th2: '你一直在用 Claude Code', th3: '哪怕你压根没用',
    beforeH: '每个提交，都写着是谁帮的忙', beforeS: 'Co-authored-by 一行，背后是哪个模型一目了然',
    instH: '一行安装，你用的 Agent 都能用', instS: 'Cursor、Codex、Gemini CLI、OpenCode、Windsurf、Cline 等等',
    readH: '先读懂仓库，再动笔', readS: '先看 status、diff 和提交历史，仓库自己的规范优先',
    afterH: '一字不差的 Claude Code 提交格式', afterS: '署名在最后一行，上方空一行，邮箱 noreply@anthropic.com',
    prH: 'PR 也一比一还原', prS: '标题不超过 70 个字符，Summary、Test plan、署名一个不少',
    reelH: '按活儿挑对 Claude', reelS: '22 个目录模型、37 种合法写法，对照 Claude Code v2.1.310 核验',
    safeH: '默认就安全', safeS: '不提交空改动，不提交密钥，不 amend，不强推',
    st1: '智商加成', st2: '官方额度', st3: '纯正 Claude 风味',
    fin: '没人会知道',
    disc: '独立社区项目，与 Anthropic 无隶属关系',
  },
}[LANG];
window.__copy = COPY;

// ───────────────────────── helpers ─────────────────────────
const $ = (id) => document.getElementById(id);
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const seg = (t, a, b) => clamp((t - a) / (b - a));
const lerp = (a, b, u) => a + (b - a) * u;
const lerp2 = (a, b, u) => [lerp(a[0], b[0], u), lerp(a[1], b[1], u)];
const expoIn = (x) => (x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, 10 * x - 10));
const expoOut = (x) => (x >= 1 ? 1 : x <= 0 ? 0 : 1 - Math.pow(2, -10 * x));
const { appleOut, appleInOut, whip } = MO;
const easeInC = (x) => x * x * x;
const cubicOut = (x) => 1 - Math.pow(1 - x, 3);
const SPC = {}; const sp = (vd, b) => (SPC[vd + ':' + b] ||= MO.spring(vd, b));
const r2 = (v) => Math.round(v * 100) / 100;
const pending = [];
function setSrc(img, src) { if (img.getAttribute('src') !== src) { img.setAttribute('src', src); pending.push(img.decode().catch(() => {})); } }
function show(el, on) { el.style.display = on ? '' : 'none'; }
function op(el, v) { el.style.opacity = clamp(v).toFixed(3); }

let STAR, TERM, MODELS, SW, STAR_C;   // star: logo-pixel outline; SW = its width in logo px
// ───────────────────────── the carry: the logo's asterisk, exactly one owner per frame ─────────────────────────
const ROT = (t) => 0.55 * Math.max(0, t - 6.0);          // a slow spin, continuous over the whole film (radians)
let CAR = null;
function carry(x, y, w, o = 1, rot, step = false) { CAR = { x, y, w, o, rot, step }; }   // step: a typing caret jumps a glyph, it does not travel (no shutter blur)
function starTf(x, y, w, rotRad) { const k = w / SW; return `translate(${r2(x)} ${r2(y)}) rotate(${(rotRad * 180 / Math.PI).toFixed(3)}) scale(${k.toFixed(6)}) translate(${(-STAR_C[0]).toFixed(2)} ${(-STAR_C[1]).toFixed(2)})`; }
function drawCarry(t) {
  const el = $('carryP');
  if (!CAR || CAR.o <= 0) { show(el, false); return; }
  show(el, true); el.setAttribute('transform', starTf(CAR.x, CAR.y, CAR.w, CAR.rot ?? ROT(t))); el.style.opacity = CAR.o;
}
// full-frame field ⇄ caret: log-space size, the centre follows the size, so the field closes ONTO the caret
const FIELD_W = () => SW * (1150 / 186) * 1.0;            // hub (inscribed r ≈ 186 logo px) covers the frame corners
function fieldZoom(u, dot, m = 1) {
  const F = { x: 960, y: 540, w: FIELD_W() * m };   // m > 1: margin so no petal gap reaches the frame edge at any angle
  const w = Math.exp(lerp(Math.log(F.w), Math.log(dot.w), u));
  const k = (Math.log(F.w) - Math.log(w)) / (Math.log(F.w) - Math.log(dot.w));
  return { x: lerp(F.x, dot.x, k), y: lerp(F.y, dot.y, k), w };
}

// ───────────────────────── captions ─────────────────────────
const CAPS = [];
function caption(id, t0, t1, head, sub) { CAPS.push({ id, t0, t1, head, sub }); }
function buildCaps() {
  const root = $('caps');
  for (const c of CAPS) {
    const mk = (cls, txt, base, size) => {
      const m = document.createElement('div'); m.className = 'mask'; m.style.top = (base - size * 1.05) + 'px'; m.style.height = (size * 1.4) + 'px';
      const d = document.createElement('div'); d.className = 'cap ' + cls; d.textContent = txt; d.style.top = (size * 0.05) + 'px';
      m.appendChild(d); root.appendChild(m); return { m, d };
    };
    c.h = mk('capH', c.head, 950, 46); c.s = c.sub ? mk('capS', c.sub, 996, 26) : null;
  }
}
function drawCaps(t) {
  let scrim = 0;
  for (const c of CAPS) {
    const on = t >= c.t0 - 0.01 && t < c.t1 + 0.3;
    show(c.h.m, on); if (c.s) show(c.s.m, on);
    if (!on) continue;
    scrim = Math.max(scrim, seg(t, c.t0 - 0.2, c.t0 + 0.1) * (1 - seg(t, c.t1, c.t1 + 0.3)));
    [c.h, c.s].forEach((L, i) => {
      if (!L) return;
      const a = sp(0.5, 0)(t - c.t0 - i * 0.065), out = easeInC(seg(t, c.t1, c.t1 + 0.28));
      const y = Math.round((1 - a) * 64 + out * 26);
      L.d.style.transform = `translateY(${y}px)`; op(L.d, (1 - out));
    });
  }
  return scrim;
}

// ───────────────────────── typed lines (thesis + finale) ─────────────────────────
const LINES = {};
function typedLine(id, text, size, wght, t0, dur, track) {
  const d = document.createElement('div'); d.className = 'ln'; d.style.fontSize = size + 'px';
  d.style.fontVariationSettings = `'wght' ${wght}`; if (track != null) d.style.letterSpacing = track + 'px';
  for (const ch of [...text]) { const s = document.createElement('span'); s.textContent = ch; d.appendChild(s); }
  $('sT').appendChild(d);
  LINES[id] = { el: d, text: [...text], size, t0, dur, spans: [...d.children], right: [], x: 0, base: 0 };
  return LINES[id];
}
function measureLine(L) { const r0 = L.el.getBoundingClientRect(); L.right = L.spans.map((s) => s.getBoundingClientRect().right - r0.left); L.width = L.right[L.right.length - 1]; }
function nTyped(L, t) { return Math.floor(clamp((t - L.t0) / L.dur) * L.text.length + 1e-6); }
function drawLine(L, t, dy = 0, o = 1) {
  const n = nTyped(L, t);
  L.spans.forEach((s, i) => { s.style.opacity = i < n ? 1 : 0; });
  L.el.style.transform = `translate(${Math.round(L.x)}px,${Math.round(L.base - L.size * 0.86 + dy)}px)`;
  op(L.el, o); show(L.el, true);
  return n;
}
function penAt(L, n) {   // the asterisk as the pen: 0.5 em wide, centred on the x-height, just after the last glyph
  const s = L.size, w = s * 0.5;
  return { x: L.x + (n > 0 ? L.right[n - 1] : 0) + s * 0.1 + w / 2, y: L.base - s * 0.36, w };
}
const keyEvents = [];
function lineKeys(L, every) { const n = L.text.length; for (let i = 0; i < n; i++) if (L.text[i] !== ' ' && (i % every === 0)) keyEvents.push({ t: L.t0 + (i + 0.5) * L.dur / n, kind: 'key' }); }

// ───────────────────────── timeline (120 BPM; bars) ─────────────────────────
//  0–6 3D open · 6–12 thesis · 12–16 before · 16–20 install · 20–26 read + commit · 26–30 after · 30–34 PR
//  34–38 model reel · 38–42 safety · 42–46 0% / 0% / 100% · 46–50 finale · 50–52.5 3D reprise · 52.5–58.5 lockup
const TH = 112;
let th1, th2, th3, fin;
function buildType() {
  const tr = LANG === 'zh' ? 1 : -1.5;
  th1 = typedLine('th1', COPY.th1, TH, 600, 6.55, 0.7, tr);
  th2 = typedLine('th2', COPY.th2, TH, 600, 7.45, 0.8, tr);
  th3 = typedLine('th3', COPY.th3, TH, 600, 10.0, 0.9, tr);
  fin = typedLine('fin', COPY.fin, 120, 600, 46.2, 0.9, tr);
}
function layoutType() {
  [th1, th2, th3, fin].forEach(measureLine);
  const lh = LANG === 'zh' ? 1.32 : 1.18;
  const mw = Math.max(th1.width, th2.width), x0 = Math.round((1920 - mw) / 2);
  th1.x = x0; th2.x = x0; th1.base = Math.round(540 - TH * lh / 2 + TH * 0.36); th2.base = Math.round(th1.base + TH * lh);
  th3.x = Math.round((1920 - th3.width) / 2); th3.base = Math.round(540 + TH * 0.36);
  fin.x = Math.round((1920 - fin.width) / 2); fin.base = Math.round(540 + 120 * 0.36);
  const ev = LANG === 'zh' ? 1 : 2; [th1, th2, th3, fin].forEach((L) => lineKeys(L, ev));
}
function drawThesis(t) {
  const on = t >= 6 && t < 12.05; show($('sT'), on || (t >= 46 && t < 49.7));
  if (!on) { [th1, th2, th3].forEach((L) => show(L.el, false)); return; }
  const outA = easeInC(seg(t, 9.6, 9.92));
  if (t < 9.95) { drawLine(th1, t, -outA * 40, 1 - outA); drawLine(th2, t, -outA * 40, 1 - outA); } else { show(th1.el, false); show(th2.el, false); }
  const outB = easeInC(seg(t, 11.45, 11.8));
  if (t >= 9.6) drawLine(th3, t, -outB * 40, 1 - outB); else show(th3.el, false);
  let c;
  if (t < 6.55) { const f = fieldZoom(expoOut(seg(t, 6.0, 6.5)), penAt(th1, 0)); carry(f.x, f.y, f.w); return; }
  const n1 = nTyped(th1, t), n2 = nTyped(th2, t), n3 = nTyped(th3, t);
  if (t < 7.2) c = { ...penAt(th1, n1), step: true };
  else if (t < 7.45) { const u = appleInOut(seg(t, 7.22, 7.44)); const a = penAt(th1, th1.text.length), b = penAt(th2, 0); c = { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), w: a.w }; }
  else if (t < 9.6) c = { ...penAt(th2, n2), step: true };
  else if (t < 10.0) { const u = appleInOut(seg(t, 9.6, 9.98)); const a = penAt(th2, th2.text.length), b = penAt(th3, 0); c = { x: lerp(a.x, b.x, u), y: lerp(a.y, b.y, u), w: a.w }; }
  else c = { ...penAt(th3, n3), step: t < 11.45 };
  if (t >= 11.45) {                    // glide down onto the terminal's first prompt; the window opens out of it at 12.0
    const p = termCaretScreen(12.0), u = whip(seg(t, 11.45, 12.0));
    c = { x: lerp(c.x, p.x, u), y: lerp(c.y, p.y, u), w: lerp(c.w, p.w, u) };
  }
  carry(c.x, c.y, c.w, 1, undefined, !!c.step);
}

// ───────────────────────── terminal (12–34, 38–42): the real session ─────────────────────────
const WIN = { x: 200, y: 92, w: 1520, h: 784 }, TBAR = 44, PADX = 34, PADY = 18, LH = 32, FS = 22;
const VIS = Math.floor((WIN.h - TBAR - PADY * 2) / LH);       // 22 rows on screen
let ADV = 13.2, BLOCK_K = 1.1;                                                   // measured in __ready
const CX0 = WIN.x + PADX, CY0 = WIN.y + TBAR + PADY;            // content origin (window space = unzoomed screen px)
// beats: [capture, t0 of typing, typing duration, clear first?, output row step]
const PLAN = [
  ['01-before', 12.35, 0.55, true, 0.04],
  ['02-install', 16.15, 0.85, true, 0.04],
  ['03-status', 20.15, 0.3, true, 0.035],
  ['04-diff', 21.0, 0.35, false, 0.03],
  ['05-log', 22.35, 0.45, false, 0.04],
  ['06-add', 23.2, 0.42, false, 0.04],
  ['07-commit', 23.85, 1.1, false, 0.05],
  ['08-after', 26.15, 0.35, true, 0.045],
  ['09-pr', 30.15, 1.05, true, 0.04],
  ['10-empty', 38.25, 0.7, true, 0.06],
  ['11-env', 39.95, 0.8, false, 0.06],
];
const ROWS = [], CLEARS = [], CMDS = [];
const COLMAP = { '#cd3131': '#C24E4E', '#f14c4c': '#C24E4E', '#0dbc79': '#8DBF8B', '#23d18b': '#8DBF8B', '#11a8cd': '#7FA6B8', '#29b8db': '#7FA6B8',
  '#e5e510': '#D8C27A', '#f5f543': '#D8C27A', '#2472c8': '#7FA6B8', '#3b8eea': '#7FA6B8', '#bc3fbc': '#B79BC9', '#d670d6': '#B79BC9', '#000000': '#141413' };
function spanEl(s) {
  const e = document.createElement(s.b ? 'b' : 'span'); e.textContent = s.t;
  const fg = s.fg && (COLMAP[s.fg] || s.fg), bg = s.bg && (COLMAP[s.bg] || s.bg);
  if (fg) e.style.color = fg; if (bg) e.style.background = bg; if (s.d) e.style.opacity = 0.6; return e;
}
function buildTerm() {
  $('ttitle').textContent = 'acme-auth — bash';
  const root = $('trows'); let idx = 0, prevEnd = 12.05;
  for (const [name, t0, dur, clear, step] of PLAN) {
    const B = TERM[name];
    if (clear) { CLEARS.push({ t: Math.floor(t0 / BAR) * BAR, row: idx }); prevEnd = Math.floor(t0 / BAR) * BAR + 0.05; }
    // command rows: typed at a fixed rate over `dur` across all its lines
    const lens = B.cmd.map((l) => [...l].length - 2), tot = lens.reduce((a, b) => a + b, 0);
    let tt = t0; const cmd = { name, rows: [], t0, dur, end: t0 + dur };
    B.cmd.forEach((line, li) => {
      const d = document.createElement('div'); d.className = 'tr mono';
      const pr = document.createElement('span'); pr.textContent = line.slice(0, 2); pr.style.color = GRAPH; d.appendChild(pr);
      const chars = [...line.slice(2)].map((ch) => { const s = document.createElement('span'); s.textContent = ch; d.appendChild(s); return s; });
      root.appendChild(d);
      const ld = dur * lens[li] / tot;
      const R = { el: d, kind: 'cmd', idx: idx++, show: li === 0 ? Math.min(prevEnd, t0 - 0.05) : tt, t0: tt, dur: ld, chars, n: chars.length };
      ROWS.push(R); cmd.rows.push(R); tt += ld;
    });
    CMDS.push(cmd);
    let ot = cmd.end + 0.12;
    B.out.forEach((spans, k) => {
      const d = document.createElement('div'); d.className = 'tr mono';
      const txt = spans.map((s) => s.t).join('');
      let host = d;
